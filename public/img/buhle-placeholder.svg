<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Portrait placeholder for Buhle Makaula">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1613"/>
      <stop offset="1" stop-color="#0b0a09"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9c98a"/>
      <stop offset="0.5" stop-color="#c9a15f"/>
      <stop offset="1" stop-color="#8a6a38"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="60%">
      <stop offset="0" stop-color="#c9a15f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c9a15f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#glow)"/>
  <!-- stylised bust silhouette -->
  <g fill="url(#gold)" opacity="0.92">
    <circle cx="450" cy="440" r="150"/>
    <path d="M210 1200 C210 900 300 720 450 720 C600 720 690 900 690 1200 Z"/>
  </g>
  <g fill="#0b0a09" opacity="0.35">
    <circle cx="450" cy="440" r="150"/>
    <path d="M210 1200 C210 900 300 720 450 720 C600 720 690 900 690 1200 Z"/>
  </g>
  <text x="450" y="1120" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="30" fill="#c9a15f" opacity="0.8">drop your portrait here → /img/buhle.jpg</text>
</svg>
