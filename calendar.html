<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buhle | Content Calendar</title>
  <meta name="robots" content="noindex" />
  <link rel="preload" href="assets/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/urbanist-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23F4622E'/><text x='50' y='72' font-size='62' font-family='Arial Black' font-weight='900' text-anchor='middle' fill='%230D0D0C'>B</text></svg>" />
  <style>
    .cal-cover { min-height: 34vh; }
    .cal-cover .wordmark { font-size: clamp(2.6rem, 9vw, 7rem); }

    .progress-card {
      display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
    }
    .progress-num { font-family: "Anton", sans-serif; font-size: 2.6rem; }
    .progress-num em { font-style: normal; color: var(--orange); }
    .progress-track {
      flex: 1; min-width: 200px; height: 12px; border-radius: 99px;
      background: var(--panel); border: 1px solid var(--line); overflow: hidden;
    }
    .progress-fill { height: 100%; background: var(--orange); border-radius: 99px; width: 0; transition: width .4s ease; }

    .week-label {
      font-family: "Anton", sans-serif; font-size: 1.4rem; text-transform: uppercase;
      color: var(--muted); padding: 1.6rem var(--pad) 0.4rem;
    }

    .post-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 1.1rem;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 1rem 1.25rem;
      margin-bottom: 0.7rem;
      transition: border-color .25s ease, opacity .25s ease;
    }
    .post-row.done { opacity: 0.45; }
    .post-row.today { border-color: var(--orange); }

    .post-date { text-align: center; min-width: 3.4rem; }
    .post-date .d { font-family: "Anton", sans-serif; font-size: 1.5rem; display: block; line-height: 1; }
    .post-date .m { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; }

    .post-main strong { display: block; font-size: 1.02rem; line-height: 1.3; }
    .post-meta { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.35rem; }
    .tag {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      border: 1px solid var(--line); color: var(--muted);
      border-radius: 99px; padding: 0.15em 0.75em;
    }
    .tag.time { color: var(--orange); border-color: var(--orange); }
    .tag.ready { color: var(--ink); background: var(--orange); border-color: var(--orange); }
    .post-main a.tag:hover { color: var(--bone); }

    .post-check { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
    .post-check input {
      width: 1.6rem; height: 1.6rem; accent-color: var(--orange); cursor: pointer;
    }
    .post-check span { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  </style>
</head>
<body>

  <div class="grain" aria-hidden="true"></div>

  <main class="page">
    <section class="cover card cal-cover">
      <header class="cover-top">
        <span class="eyebrow">AI, Made Simple</span>
        <nav class="cover-nav">
          <a href="index.html">Portfolio</a>
          <a href="brand.html">Brand kit</a>
        </nav>
      </header>
      <div class="cover-title"><h1 class="wordmark">CALENDAR</h1></div>
      <footer class="cover-bottom">
        <span>30 days, tick them off as you post</span>
        <span>Buhle Makaula</span>
      </footer>
    </section>

    <section class="card progress-card">
      <span class="progress-num"><em id="done-count">0</em>/<span id="total-count">30</span> posted</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </section>

    <section id="list"></section>
  </main>

  <script>
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const stored = JSON.parse(localStorage.getItem("posted") || "{}");

    fetch("content/calendar.json").then(r => r.json()).then(cal => {
      const list = document.getElementById("list");
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById("total-count").textContent = cal.posts.length;

      cal.posts.forEach((p, i) => {
        if (i % 7 === 0) {
          const wl = document.createElement("h2");
          wl.className = "week-label";
          wl.textContent = "Week " + (Math.floor(i / 7) + 1);
          list.appendChild(wl);
        }
        const d = new Date(p.date + "T00:00:00");
        const row = document.createElement("div");
        row.className = "post-row" + (stored[p.date] ? " done" : "") + (p.date === today ? " today" : "");
        row.innerHTML = `
          <div class="post-date"><span class="d">${d.getDate()}</span><span class="m">${DAYS[d.getDay()]} ${MONTHS[d.getMonth()]}</span></div>
          <div class="post-main">
            <strong>${p.title}</strong>
            <div class="post-meta">
              <span class="tag time">${p.time_sast} SAST</span>
              <span class="tag">${p.format}</span>
              <span class="tag">${p.pillar}</span>
              <span class="tag ${p.status === "ready" ? "ready" : ""}">${p.status}</span>
              ${p.status === "ready" ? `<a class="tag" href="content/output/${p.date}/slide-01.png">slides</a>` : ""}
            </div>
          </div>
          <label class="post-check"><input type="checkbox" ${stored[p.date] ? "checked" : ""} data-date="${p.date}" /><span>posted</span></label>`;
        list.appendChild(row);
      });

      function refresh() {
        const done = Object.values(stored).filter(Boolean).length;
        document.getElementById("done-count").textContent = done;
        document.getElementById("progress-fill").style.width = (done / cal.posts.length * 100) + "%";
      }
      refresh();

      list.addEventListener("change", (e) => {
        if (e.target.matches("input[type=checkbox]")) {
          stored[e.target.dataset.date] = e.target.checked;
          localStorage.setItem("posted", JSON.stringify(stored));
          e.target.closest(".post-row").classList.toggle("done", e.target.checked);
          refresh();
        }
      });
    });
  </script>
</body>
</html>
